<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Laxman Ultimate AI Assistant</title></head><body><script>
'use strict';
const enc=new TextEncoder(),dec=new TextDecoder();
const ok=(result)=>JSON.stringify({result}); const fail=e=>JSON.stringify({error:String(e?.message||e)});
const num=(v,d=0)=>{const x=Number(v);return Number.isFinite(x)?x:d};
async function fj(u){const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function ft(u){const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return r.text()}
async function hash(t,a='SHA-256'){const b=await crypto.subtle.digest(a,enc.encode(String(t??'')));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function calc(e){let s=String(e??'').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'');if(!/^[0-9+\-*/%().\s^]+$/.test(s))throw Error('Only numeric expressions are allowed');s=s.replace(/\^/g,'**');const v=Function('"use strict";return ('+s+')')();if(!Number.isFinite(v))throw Error('Non-finite result');return v}
function convert(c,v,f,t){v=num(v);const m={length:{m:1,km:1000,cm:.01,mm:.001,ft:.3048,inch:.0254,mi:1609.344,yd:.9144},mass:{kg:1,g:.001,mg:1e-6,lb:.45359237,oz:.028349523125},volume:{l:1,ml:.001,m3:1000,gal:3.785411784,cup:.2365882365},area:{m2:1,km2:1e6,ft2:.09290304,acre:4046.8564224},speed:{mps:1,kph:1/3.6,mph:.44704,knot:.514444}};if(c==='temperature'){const x=f==='c'?v:f==='f'?(v-32)*5/9:f==='k'?v-273.15:v;return t==='c'?x:t==='f'?x*9/5+32:t==='k'?x+273.15:x}if(!m[c]||m[c][f]===undefined||m[c][t]===undefined)throw Error('Unsupported unit');return v*m[c][f]/m[c][t]}
async function search(q){const d=await fj('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1');const r=[];if(d.AbstractText)r.push({title:d.Heading||q,url:d.AbstractURL||'',snippet:d.AbstractText});for(const x of d.RelatedTopics||[]){if(x.Text)r.push({title:x.Text,url:x.FirstURL||'',snippet:x.Text});else for(const y of x.Topics||[])if(y.Text)r.push({title:y.Text,url:y.FirstURL||'',snippet:y.Text})}return {query:q,source:'DuckDuckGo Instant Answer',results:r.slice(0,10)}}
async function news(q){const rss='https://news.google.com/rss/search?q='+encodeURIComponent(q||'Nepal')+'&hl=en-US&gl=US&ceid=US:en';const d=await fj('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss));return {query:q||'Nepal',source:'Google News RSS via rss2json',items:(d.items||[]).slice(0,10).map(x=>({title:x.title,url:x.link,published:x.pubDate,source:x.author}))}}
async function weather(city,lat,lon){let la=lat,lo=lon,name=city;if((la===undefined||lo===undefined)&&city){const g=await fj('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');if(!g.results?.length)throw Error('Location not found');la=g.results[0].latitude;lo=g.results[0].longitude;name=g.results[0].name}if(la===undefined||lo===undefined)throw Error('Provide city or coordinates');const d=await fj(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&forecast_days=3&timezone=auto`);return {location:name||`${la},${lo}`,source:'Open-Meteo',current:d.current,timezone:d.timezone,hourly:d.hourly}}
async function wiki(q,lang='en'){const d=await fj(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(String(q).replace(/\s+/g,'_'))}`);return {title:d.title,extract:d.extract,url:d.content_urls?.desktop?.page||'',source:'Wikipedia'}}
async function page(u){try{return {url:u,content:(await ft(u)).replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,15000)}}catch(e){const p='https://api.allorigins.win/raw?url='+encodeURIComponent(u);return {url:u,content:(await ft(p)).replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,15000),via:'CORS fallback'}}}
function password(l=20){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=';const a=new Uint32Array(l);crypto.getRandomValues(a);return [...a].map(x=>c[x%c.length]).join('')}
function random(min=0,max=100){min=Math.ceil(num(min));max=Math.floor(num(max));if(max<min)[min,max]=[max,min];const a=new Uint32Array(1);crypto.getRandomValues(a);return min+Math.floor(a[0]/4294967296*(max-min+1))}
function color(c){const m=String(c).trim().match(/^#([0-9a-f]{3,6})$/i);if(!m)throw Error('Use a hex color');let h=m[1];if(h.length===3)h=h.split('').map(x=>x+x).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);let rr=r/255,gg=g/255,bb=b/255,max=Math.max(rr,gg,bb),min=Math.min(rr,gg,bb),d=max-min,l=(max+min)/2,hue=0,s=0;if(d){s=l>.5?d/(2-max-min):d/(max+min);switch(max){case rr:hue=(gg-bb)/d+(gg<bb?6:0);break;case gg:hue=(bb-rr)/d+2;break;default:hue=(rr-gg)/d+4}hue/=6}return {hex:'#'+h.toUpperCase(),rgb:`rgb(${r}, ${g}, ${b})`,hsl:`hsl(${Math.round(hue*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`}}
async function run(o){switch(o.action){case'search':return search(o.query||'');case'news':return news(o.query||'Nepal');case'weather':return weather(o.city,o.lat,o.lon);case'wikipedia':return wiki(o.query||o.text||'',o.lang||'en');case'fetch_page':return page(o.query||o.url||'');case'summarize_text':return {text:String(o.text||''),instruction:'Summarize the supplied text in the user language while preserving key facts.'};case'calculator':return {expression:o.expression,result:calc(o.expression)};case'currency':{const a=num(o.amount,1),f=(o.from||'EUR').toUpperCase(),t=(o.to||'USD').toUpperCase(),d=await fj(`https://api.frankfurter.app/latest?amount=${a}&from=${f}&to=${t}`);return {source:'Frankfurter',...d}}case'unit_convert':return {category:o.category,value:num(o.value),from:o.from_unit,to:o.to_unit,result:convert(o.category,o.value,o.from_unit,o.to_unit)};case'timezone':{const z=o.query||o.timezone||'Asia/Kathmandu';return {timezone:z,now:new Intl.DateTimeFormat('en-GB',{dateStyle:'full',timeStyle:'long',timeZone:z}).format(new Date())}}case'qr':{const d=o.query||o.text||'';return {url:`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(d)}`,data:d}}case'hash':return {algorithm:o.algorithm||'SHA-256',hash:await hash(o.text||'',o.algorithm||'SHA-256')};case'base64':if((o.mode||'encode')==='decode')return {result:dec.decode(Uint8Array.from(atob(o.text||''),c=>c.charCodeAt(0)))};return {result:btoa(String.fromCharCode(...enc.encode(String(o.text||''))))};case'json_format':{const v=typeof o.text==='string'?JSON.parse(o.text):o.data;return {formatted:JSON.stringify(v,null,2),compact:JSON.stringify(v)}}case'regex':{const re=new RegExp(o.pattern||'',o.flags||'g'),t=String(o.text||'');return {test:new RegExp(o.pattern||'',o.flags?.replace('g','')||'').test(t),matches:[...t.matchAll(re)].map(x=>x[0])}}case'color':return color(o.color||o.text||'');case'password':return {password:password(Math.max(4,Math.min(256,num(o.length,20))))};case'random':return {value:random(o.min,o.max)};case'ip':return fj('https://ipapi.co/json/');case'url':{const u=o.query||o.url||'';return {url:u,encoded:encodeURI(u)}}case'maps':{const q=o.query||'';return {url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}}case'notes':{const k=String(o.key||'note');if(o.value!==undefined){localStorage.setItem('lua:'+k,String(o.value));return {saved:true,key:k,value:String(o.value)}}return {key:k,value:localStorage.getItem('lua:'+k)}}case'pomodoro':{const m=Math.max(1,num(o.minutes,25));return {minutes:m,seconds:m*60}}case'countdown':{const s=Math.max(0,num(o.seconds,o.minutes?o.minutes*60:60));return {seconds:s,display:`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}}case'tip':{const bill=num(o.amount),p=num(o.tip_percent,10),people=Math.max(1,num(o.people,1));return {tip:bill*p/100,total:bill*(1+p/100),per_person:bill*(1+p/100)/people}}case'bmi':{const h=num(o.height_cm)/100,w=num(o.weight_kg);if(h<=0||w<=0)throw Error('Valid height and weight required');const b=w/(h*h);return {bmi:+b.toFixed(2),category:b<18.5?'underweight':b<25?'normal':b<30?'overweight':'obesity'}}case'percentage':{const x=num(o.value),y=num(o.total);return {percent:y?x/y*100:0}}case'date_diff':{const s=new Date(o.start),e=new Date(o.end);if(isNaN(s)||isNaN(e))throw Error('Use ISO dates');const days=Math.round((e-s)/86400000);return {days,weeks:days/7}}case'text_stats':{const t=String(o.text||'');return {characters:t.length,characters_no_spaces:t.replace(/\s/g,'').length,words:t.trim()?t.trim().split(/\s+/).length:0,lines:t?t.split(/\r?\n/).length:0}}case'encode_uri':return encodeURIComponent(String(o.text||''));case'decode_uri':return decodeURIComponent(String(o.text||''));case'uuid':return crypto.randomUUID();case'word_count':{const t=String(o.text||'').trim();return t?t.split(/\s+/).length:0}default:throw Error('Unknown action: '+o.action)}}
window.ai_edge_gallery_get_result=async(data)=>{try{return ok(await run(typeof data==='string'?JSON.parse(data):data))}catch(e){console.error(e);return fail(e)}};
</script></body></html>
