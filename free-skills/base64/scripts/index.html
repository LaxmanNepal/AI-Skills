<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),m=o.mode||'encode',r;if(m==='decode'){r=new TextDecoder().decode(Uint8Array.from(atob(o.text||''),c=>c.charCodeAt(0)))}else{r=btoa(String.fromCharCode(...new TextEncoder().encode(o.text||'')))}return JSON.stringify({result:r})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
