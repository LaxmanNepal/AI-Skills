<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:28px}
