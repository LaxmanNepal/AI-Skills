<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let u=String(JSON.parse(d).url||'');if(!/^https?:\/\//i.test(u))throw Error('URL must start with http:// or https://');let x=new URL(u);return JSON.stringify({result:{url:x.href,encoded:encodeURI(x.href),host:x.host}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
