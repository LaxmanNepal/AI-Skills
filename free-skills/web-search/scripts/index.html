<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let q=JSON.parse(d).query||'',x=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1').then(r=>r.json()),a=[];if(x.AbstractText)a.push({title:x.Heading||q,snippet:x.AbstractText,url:x.AbstractURL||''});for(const t of x.RelatedTopics||[])if(t.Text)a.push({title:t.Text,snippet:t.Text,url:t.FirstURL||''});return JSON.stringify({result:a.slice(0,10),source:'DuckDuckGo'})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
