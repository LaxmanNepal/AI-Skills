<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),s=Math.max(0,Number(o.seconds??(o.minutes||0)*60));return JSON.stringify({result:{seconds:s,display:`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
