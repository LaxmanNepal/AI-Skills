<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),r=new RegExp(o.pattern||'',o.flags||'g'),m=[...String(o.text||'').matchAll(r)].map(x=>x[0]);return JSON.stringify({result:{matches:m,test:r.test(String(o.text||''))}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
