<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),a=Number(o.amount??1),f=(o.from||'USD').toUpperCase(),t=(o.to||'NPR').toUpperCase(),x=await fetch(`https://api.frankfurter.app/latest?amount=${a}&from=${f}&to=${t}`).then(r=>r.json());return JSON.stringify({result:x,source:'Frankfurter'})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
