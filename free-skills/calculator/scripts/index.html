<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),s=String(o.expression).replace(/×/g,'*').replace(/÷/g,'/');if(!/^[0-9+\-*/%().\s^]+$/.test(s))throw Error('Only numeric expressions are allowed');let r=Function('"use strict";return ('+s.replace(/\^/g,'**')+')')();if(!Number.isFinite(r))throw Error('Invalid result');return JSON.stringify({result:r})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
