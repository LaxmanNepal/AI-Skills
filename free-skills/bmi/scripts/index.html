<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),h=Number(o.height_cm)/100,w=Number(o.weight_kg),b=w/(h*h);if(!h||!w)throw Error('Valid height and weight required');return JSON.stringify({result:{bmi:Number(b.toFixed(2)),category:b<18.5?'underweight':b<25?'normal':b<30?'overweight':'obesity'}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
