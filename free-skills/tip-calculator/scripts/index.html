<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),b=Number(o.amount)||0,p=Number(o.tip_percent)||10,n=Math.max(1,Number(o.people)||1),tip=b*p/100,total=b+tip;return JSON.stringify({result:{tip,total,per_person:total/n}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
