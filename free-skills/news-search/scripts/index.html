<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),q=o.query||'Nepal',rss='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en',x=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss)).then(r=>r.json());return JSON.stringify({result:(x.items||[]).slice(0,10).map(i=>({title:i.title,url:i.link,date:i.pubDate,source:i.author||''})),source:'Google News RSS'})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
