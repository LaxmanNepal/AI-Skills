<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let h=(JSON.parse(d).color||'').replace('#','');if(h.length===3)h=[...h].map(x=>x+x).join('');if(!/^[0-9a-f]{6}$/i.test(h))throw Error('Use #RRGGBB');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4),16),R=r/255,G=g/255,B=b/255,max=Math.max(R,G,B),min=Math.min(R,G,B),l=(max+min)/2,dlt=max-min,s=dlt?(l>.5?dlt/(2-max-min):dlt/(max+min)):0,hh=dlt===0?0:max===R?(G-B)/dlt+(G<B?6:0):max===G?(B-R)/dlt+2:(R-G)/dlt+4;return JSON.stringify({result:{hex:'#'+h.toUpperCase(),rgb:`rgb(${r}, ${g}, ${b})`,hsl:`hsl(${Math.round(hh*60)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
