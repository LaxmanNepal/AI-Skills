<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),k='laxman-note:'+o.key;if(o.action==='save')localStorage.setItem(k,String(o.value??''));return JSON.stringify({result:{key:o.key,value:localStorage.getItem(k),saved:o.action==='save'}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
