<!doctype html><html><body><script>const j=x=>JSON.stringify({result:x});const e=x=>JSON.stringify({error:x.message||String(x)});async function run(o){switch(o.action){case'calculator':{let s=String(o.expression||'').replace(/×/g,'*').replace(/÷/g,'/');if(!/^[0-9+\-*/%().\s^]+$/.test(s))throw Error('Invalid expression');return Function('return ('+s.replace(/\^/g,'**')+')')()}case'weather':{let la=o.lat,lo=o.lon;if(la==null){let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(o.city||'')+'&count=1&format=json').then(r=>r.json());if(!g.results?.length)throw Error('Location not found');la=g.results[0].latitude;lo=g.results[0].longitude}return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`).then(r=>r.json())}case'wikipedia':{let l=o.lang||'en',q=encodeURIComponent(String(o.query||'').replace(/\s+/g,'_'));return fetch(`https://${l}.wikipedia.org/api/rest_v1/page/summary/${q}`).then(r=>r.json())}case'currency':return fetch(`https://api.frankfurter.app/latest?amount=${Number(o.amount)||1}&from=${o.from||'USD'}&to=${o.to||'NPR'}`).then(r=>r.json());case'search':return fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(o.query||'')+'&format=json&no_html=1').then(r=>r.json());case'hash':{let b=await crypto.subtle.digest(o.algorithm||'SHA-256',new TextEncoder().encode(o.text||''));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}case'password':{let n=Math.max(8,Math.min(256,Number(o.length)||20)),c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=',a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')}case'random':{let a=Math.ceil(Number(o.min??0)),b=Math.floor(Number(o.max??100)),x=new Uint32Array(1);crypto.getRandomValues(x);return a+Math.floor(x[0]/4294967296*(b-a+1))}case'uuid':return crypto.randomUUID();case'json_format':return JSON.stringify(JSON.parse(o.text),null,2);default:throw Error('Unsupported action: '+o.action)}}window.ai_edge_gallery_get_result=async d=>{try{return j(await run(JSON.parse(d)))}catch(x){return e(x)}};</script></body></html>
