<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),la=o.lat,lo=o.lon;if(la==null||lo==null){let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(o.city||'')+'&count=1&format=json').then(r=>r.json());if(!g.results?.length)throw Error('Location not found');la=g.results[0].latitude;lo=g.results[0].longitude}let x=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&forecast_days=3&timezone=auto`).then(r=>r.json());return JSON.stringify({result:x,source:'Open-Meteo'})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
