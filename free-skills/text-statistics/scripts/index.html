<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let t=String(JSON.parse(d).text||''),w=t.trim()?t.trim().split(/\s+/).length:0;return JSON.stringify({result:{characters:t.length,characters_no_spaces:t.replace(/\s/g,'').length,words:w,lines:t?t.split(/\r?\n/).length:0}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
