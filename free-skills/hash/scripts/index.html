<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),a=o.algorithm||'SHA-256',b=await crypto.subtle.digest(a,new TextEncoder().encode(o.text||'')),h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');return JSON.stringify({result:{algorithm:a,hash:h}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
