<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),a=new Date(o.start),b=new Date(o.end);if(isNaN(a)||isNaN(b))throw Error('Use ISO dates');let days=Math.round((b-a)/86400000);return JSON.stringify({result:{days,weeks:days/7}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
