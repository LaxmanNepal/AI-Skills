<!doctype html><html><body><script>window.ai_edge_gallery_get_result=async d=>{try{let o=JSON.parse(d),l=o.lang||'en',q=String(o.query||'').replace(/\s+/g,'_'),x=await fetch(`https://${l}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`).then(r=>r.json());if(x.type==='https://mediawiki.org/wiki/HyperSwitch/errors/not_found')throw Error('Wikipedia page not found');return JSON.stringify({result:{title:x.title,extract:x.extract,url:x.content_urls?.desktop?.page||''}})}catch(e){return JSON.stringify({error:e.message})}};</script></body></html>
